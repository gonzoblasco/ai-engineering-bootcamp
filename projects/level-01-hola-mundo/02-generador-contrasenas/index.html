<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Generador de contraseñas seguras en JavaScript vanilla — longitud configurable, mayúsculas, números, símbolos, medidor de fortaleza y copia al clipboard." />
  <title>🔐 Generador de Contraseñas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== MAIN ===== -->
  <main class="app">
    <section class="card" aria-labelledby="app-title">
      <header class="card-header">
        <span class="card-icon">🔐</span>
        <h1 class="card-title" id="app-title">Generador de Contraseñas</h1>
        <p class="card-subtitle">Crea contraseñas seguras al instante</p>
      </header>

      <!-- ===== DISPLAY + COPY ===== -->
      <div class="password-display">
        <input
          type="text"
          id="password"
          class="password-field"
          readonly
          aria-label="Contraseña generada"
          placeholder="Tu contraseña aparecerá aquí"
        />
        <button
          type="button"
          id="copyBtn"
          class="copy-btn"
          aria-label="Copiar contraseña al portapapeles"
          title="Copiar"
        >
          📋
        </button>
      </div>

      <!-- ===== STRENGTH METER ===== -->
      <div class="strength" id="strength">
        <div class="strength-bar">
          <div class="strength-fill" id="strengthFill"></div>
        </div>
        <span class="strength-label" id="strengthLabel">—</span>
      </div>

      <!-- ===== OPTIONS FORM ===== -->
      <form class="options" id="optionsForm" autocomplete="off">
        <!-- Longitud -->
        <div class="option-row">
          <label for="length" class="option-label">
            Longitud <span class="length-value" id="lengthValue">16</span>
          </label>
          <input
            type="range"
            id="length"
            class="range"
            min="8"
            max="32"
            value="16"
            aria-label="Longitud de la contraseña"
          />
        </div>

        <!-- Toggles -->
        <div class="toggles">
          <label class="toggle">
            <input type="checkbox" id="uppercase" checked />
            <span class="toggle-box" aria-hidden="true"></span>
            <span class="toggle-text">Mayúsculas (A-Z)</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="numbers" checked />
            <span class="toggle-box" aria-hidden="true"></span>
            <span class="toggle-text">Números (0-9)</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="symbols" checked />
            <span class="toggle-box" aria-hidden="true"></span>
            <span class="toggle-text">Símbolos (!@#$)</span>
          </label>
        </div>

        <!-- Validación -->
        <p class="form-error" id="error" role="alert"></p>

        <!-- Generar -->
        <button type="submit" class="btn btn-primary btn-full" id="generateBtn">
          🎲 Generar contraseña
        </button>
      </form>
    </section>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast" role="status" aria-live="polite">¡Copiado!</div>
  </main>

  <script src="script.js"></script>
</body>
</html>

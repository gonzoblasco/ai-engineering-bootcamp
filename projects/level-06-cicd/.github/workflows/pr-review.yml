name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr-diff.txt

      - name: Analyze PR
        id: analyze
        run: |
          node scripts/analyze-pr.js --diff /tmp/pr-diff.txt > /tmp/analysis.json
          echo "analysis=$(cat /tmp/analysis.json)" >> $GITHUB_OUTPUT

      - name: Gate - fail check on critical findings
        if: always()
        run: |
          node scripts/analyze-pr.js --diff /tmp/pr-diff.txt --gate || exit 1

      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const analysis = JSON.parse(`${{ steps.analyze.outputs.analysis }}`);

            // Buscar comentario existente del bot
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('PR Review Automático')
            );

            // Generar markdown
            let body = `## 🤖 PR Review Automático\n\n`;
            body += `### Resumen\n\n`;
            body += `| Métrica | Valor |\n`;
            body += `|---------|-------|\n`;
            body += `| Archivos cambiados | ${analysis.summary.filesChanged} |\n`;
            body += `| Líneas agregadas | ${analysis.summary.linesAdded} |\n`;
            body += `| Líneas eliminadas | ${analysis.summary.linesRemoved} |\n`;
            body += `| Hallazgos | ${analysis.findings.length} |\n\n`;

            if (analysis.findings.length > 0) {
              body += `### Hallazgos\n\n`;
              body += `| Archivo | Línea | Tipo | Severidad | Descripción |\n`;
              body += `|---------|-------|------|-----------|-------------|\n`;

              for (const f of analysis.findings) {
                const icon = f.severity === 'high' ? '🔴' : f.severity === 'medium' ? '🟡' : '🟢';
                body += `| ${f.file} | ${f.line} | ${f.type} | ${icon} ${f.severity} | ${f.description} |\n`;
              }
              body += `\n`;
            }

            if (analysis.suggestions.length > 0) {
              body += `### Sugerencias\n\n`;
              for (const s of analysis.suggestions) {
                body += `- ${s}\n`;
              }
              body += `\n`;
            }

            body += `---\n*Review generado automáticamente por AI Engineering Bootcamp Nivel 6*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Prove the gate: the pipeline tests its own gate on every PR.
  # A gate that can't be tested isn't a gate (see Project 3).
  prove-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run gate tests
        run: node scripts/test-gate.js

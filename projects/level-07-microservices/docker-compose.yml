services:
  users-service:
    build:
      context: .
      dockerfile: users-service/Dockerfile
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  orders-service:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  notifications-service:
    build:
      context: .
      dockerfile: notifications-service/Dockerfile
    # Sin puertos expuestos — solo consume eventos
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

AWSTemplateFormatVersion: '2010-09-09'
Description: Fixture roto - port mismatch (users en 3002 en vez de 3001)

Resources:
  UsersTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'users-service-${Environment}'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ContainerDefinitions:
        - Name: users-service
          Image: !Ref UsersImageURI
          Essential: true
          PortMappings:
            - ContainerPort: 3002
              Protocol: tcp

  OrdersTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'orders-service-${Environment}'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ContainerDefinitions:
        - Name: orders-service
          Image: !Ref OrdersImageURI
          Essential: true
          PortMappings:
            - ContainerPort: 3002
              Protocol: tcp

  UsersTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 3001
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health

  OrdersTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 3002
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref UsersTargetGroup

AWSTemplateFormatVersion: '2010-09-09'
Description: Fixture roto - sin Listener en el ALB

Resources:
  UsersTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'users-service-${Environment}'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ContainerDefinitions:
        - Name: users-service
          Image: !Ref UsersImageURI
          Essential: true
          PortMappings:
            - ContainerPort: 3001
              Protocol: tcp

  OrdersTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'orders-service-${Environment}'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ContainerDefinitions:
        - Name: orders-service
          Image: !Ref OrdersImageURI
          Essential: true
          PortMappings:
            - ContainerPort: 3002
              Protocol: tcp

  UsersTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 3001
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health

  OrdersTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 3002
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
